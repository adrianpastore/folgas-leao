<style>
:root{
  --bg:#f2f4ef;--paper:#fff;--ink:#17221b;--mut:#5b695f;--line:#d6ddd4;
  --band:#1f4a33;--band-ink:#fff;--green:#1f4a33;--green-2:#e2ece4;
  --wine:#8e1f2f;--wine-2:#f7e3e6;--ok:#23704a;--ok-2:#dcefe3;--warn:#9a5a08;--warn-2:#fbeed8;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1612;--paper:#18221c;--ink:#edf2ec;--mut:#9aa89e;--line:#2b3a31;
  --band:#15301f;--green:#8fd0a8;--green-2:#1f3326;
  --wine:#ee8593;--wine-2:#3b1d23;--ok:#74d29c;--ok-2:#173424;--warn:#eab466;--warn-2:#382a14}}
:root[data-theme="dark"]{
  --bg:#0f1612;--paper:#18221c;--ink:#edf2ec;--mut:#9aa89e;--line:#2b3a31;
  --band:#15301f;--green:#8fd0a8;--green-2:#1f3326;
  --wine:#ee8593;--wine-2:#3b1d23;--ok:#74d29c;--ok-2:#173424;--warn:#eab466;--warn-2:#382a14}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hh,0px) + 8px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wine);outline-offset:2px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.hdr::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--band)}
.top{background:var(--band);color:var(--band-ink);border-bottom:4px solid #8e1f2f}
#hsub{background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 4px 10px rgba(0,0,0,.06)}
#hsub:empty{display:none}
.hsub-in{max-width:680px;margin:0 auto;padding:8px 14px 8px}
#hsub .mnav{margin:0 0 6px}
#hsub .mnav h2{font-size:20px!important}
#hsub .ib{width:38px;height:38px;font-size:20px}
#hsub .fwchips{margin:0!important;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start!important;gap:6px;scrollbar-width:none;padding-bottom:2px}
#hsub .fwchips::-webkit-scrollbar{display:none}
#hsub .fwchips .chip{flex:0 0 auto;white-space:nowrap}
#hsub .fwchips .chip:first-child{margin-left:auto}#hsub .fwchips .chip:last-child{margin-right:auto}
#hsub .chip{min-height:34px!important;padding:4px 10px!important;font-size:15px}
.top-in{max-width:680px;margin:0 auto;padding:10px 16px 9px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:4px 12px}
.brand small{display:block;font-size:13px;opacity:.8;letter-spacing:.02em}
.brand h1{margin:0;font:700 23px/1 var(--cond);letter-spacing:.01em;white-space:nowrap}
.sync{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#9fd8b3;display:inline-block}
.sync.saving i{background:#f3c46b}.sync.err i,.sync.local i{background:#f2a0a9}

main{max-width:680px;margin:0 auto;padding:14px 14px 110px}

/* month nav */
.mnav{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.mnav h2{flex:1;margin:0;text-align:center;font:700 24px/1.1 var(--cond)}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:22px;line-height:1;display:grid;place-items:center}
.lead{margin:0 0 14px;text-align:center;color:var(--mut);font-size:15px}

/* sunday cards */
.sun{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sun.past{opacity:.62}
.sun.open{opacity:1;border-color:var(--green)}
.sun-h{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px}
.sun-h:focus-visible{outline:3px solid var(--wine);outline-offset:-3px}
.dnum{font:700 44px/.9 var(--cond);color:var(--wine);min-width:60px;text-align:center}
.dmeta b{display:block;font-weight:600}
.dmeta small{color:var(--mut);font-size:14px;display:block}
.nexttag{display:inline-block;font-size:12px;font-weight:600;color:var(--band-ink);background:var(--green);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
:root[data-theme="dark"] .nexttag{color:#0f1612}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nexttag{color:#0f1612}}
.pill{font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-2);color:var(--ok)}
.pill.warn{background:var(--warn-2);color:var(--warn)}
.pill.none{background:var(--bg);color:var(--mut)}
.sun-b{padding:4px 14px 14px;border-top:1px dashed var(--line)}
.step{font:700 19px/1.2 var(--cond);margin:14px 0 2px;display:flex;gap:8px;align-items:baseline}
.step span{color:var(--wine)}
.hint{color:var(--mut);font-size:14px;margin:0 0 8px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;text-align:left;min-height:48px}
.chip small{display:block;color:var(--mut);font-size:12px;line-height:1.1}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.chip.on small{color:#fff;opacity:.85}
:root[data-theme="dark"] .chip.on,:root[data-theme="dark"] .chip.on small{color:#1a0d10}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on,:root:not([data-theme="light"]) .chip.on small{color:#1a0d10}}

.cov{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--bg)}
.cov-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.cov-h b{font-size:17px}.cov-h .role{color:var(--mut);font-size:14px;margin-left:4px}
.st{font-size:13px;font-weight:600}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--wine)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px;background:var(--paper)}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;font-size:15px;min-height:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--green);color:var(--band-ink);font-weight:600}
:root[data-theme="dark"] .seg button.on{color:#0f1612}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{color:#0f1612}}
.seg.s3 button.on.ok{background:var(--ok)}.seg.s3 button.on.bad{background:var(--wine)}.seg.s3 button.on.warn{background:var(--warn)}
label.fl{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
select,input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;min-height:46px}
.note{font-size:14px;margin:10px 0 0}
.note.ok{color:var(--ok)}.note.bad{color:var(--wine)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.wa{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--wine);border-color:transparent;background:transparent}
.work{color:var(--mut);font-size:14px;margin:14px 0 0}

/* team */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.sec h2{margin:0;font:700 22px/1 var(--cond)}
.sec small{color:var(--mut)}
.person{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.person>button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px}
.person>button:focus-visible{outline:3px solid var(--wine);outline-offset:-3px}
.person .pm{color:var(--mut);font-size:14px;display:block}
.person .edit{color:var(--mut);font-size:14px}
.pform{padding:0 14px 14px}
.addbox{background:var(--paper);border:1.5px dashed var(--green);border-radius:14px;padding:14px;margin-bottom:6px}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--mut);text-align:center}

/* share */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font:700 20px/1.1 var(--cond)}
.pre{white-space:pre-wrap;font:14px/1.45 var(--body);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0 0;user-select:text;max-height:260px;overflow:auto}
.gi{width:100%;border:1px solid var(--line);border-radius:10px;margin-top:10px;display:block}
.cimg{background:#fff;color:#17221b;border-radius:10px;overflow:hidden;margin-top:10px;border:1px solid #d6ddd4}
.ch{background:#1f4a33;color:#fff;border-bottom:4px solid #8e1f2f;padding:8px 10px}
.ch b{display:block;font:700 18px/1.1 var(--cond)}.ch span{font-size:12px;opacity:.85}
.cg{display:grid;grid-template-columns:2.4fr repeat(6,1fr);gap:2px;padding:6px}
.wd{font-size:10px;font-weight:700;color:#5b695f;padding:2px 3px}.wd.sd{color:#8e1f2f}
.c{background:#f1f3ee;min-height:34px;padding:3px;font-size:11px;color:#5b695f;overflow:hidden}.c.e{background:#fafbf8}
.c.s{background:#f7e3e6;min-height:56px;color:#17221b}
.c .n{font-size:11px;font-weight:700;display:block}.c.s .n{color:#8e1f2f;font-size:13px}
.nm{font-size:12px;font-weight:700;overflow-wrap:anywhere}.ex{font-size:10.5px;color:#23704a;margin-bottom:2px}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs-in{max-width:680px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--mut);min-height:60px;position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--wine);font-weight:600}
.tabs button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--wine);border-radius:0 0 3px 3px}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--warn);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-weight:700}
.cal-d .fech{font-size:10px;font-weight:600;color:var(--mut);letter-spacing:.02em}
.cal-d.closed{opacity:.55;cursor:pointer}
.cal-d .cnt{font-size:10px;font-weight:600;color:var(--mut)}
.cal-d.sel{outline:2px solid var(--green);outline-offset:-2px}
#sheet{position:fixed;inset:0;z-index:8}
#covm{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}
#covm[hidden]{display:none}
@media (min-width:600px){#covm{align-items:center}}
.cm{position:relative;width:100%;max-width:520px;max-height:82vh;max-height:82dvh;background:var(--paper);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.3);animation:shup .16s ease-out}
@media (min-width:600px){.cm{border-radius:18px}}
.cm-h{display:flex;gap:10px;align-items:center;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.cm-h b{display:block;font:700 21px/1.15 var(--cond)}
.cm-h small{display:block;color:var(--mut);font-size:13px}
.cm-h .ib{width:38px;height:38px;font-size:16px}
.cm-b{overflow-y:auto;padding:0 16px 14px}
.cm-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.vgrid label{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:600;color:var(--mut)}
.vgrid input{min-height:40px;padding:6px 8px;text-align:right}
.prow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px}
.prow+.prow{border-top:1px solid var(--line)}
.prow .lr-t small{white-space:normal}
.pv{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.pv b{font-size:16px}.pv small{color:var(--mut);font-size:12px}
.ptot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:2px solid var(--line);background:var(--bg);font-weight:600}
.ptot b{font-size:18px;color:var(--green)}
.lbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);margin-top:6px}
.lrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;min-height:54px}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow:hover{background:var(--bg)}
.lrow:focus-visible{outline:3px solid var(--wine);outline-offset:-3px}
.lr-t{flex:1;min-width:0}.lr-t b{display:block;font-weight:600}.lr-t small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .st{text-align:right;max-width:46%}
.lr-c{color:var(--mut);font-size:20px}
.sec-h{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:14px;padding:4px 0}
.sec-h:focus-visible{outline:3px solid var(--wine)}
.sec-s{font-size:13px;color:var(--mut);font-weight:600}
#sheet[hidden]{display:none}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sh{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;max-height:88vh;max-height:88dvh;background:var(--paper);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:shup .18s ease-out}
@keyframes shup{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.sh-h .ib{width:38px;height:38px;font-size:18px;flex:0 0 auto}
.sh-t{flex:1;min-width:0}
.sh-t .dname{text-align:left}
.sh-t .pill{font:600 12px var(--body);text-transform:none;letter-spacing:0;padding:2px 8px}
.sh-t b{display:block;font:700 22px/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-b{overflow-y:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:15px;z-index:9;max-width:calc(100% - 28px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
.toast[hidden]{display:none}
/* v2 */
.dname{font:700 15px/1 var(--cond);color:var(--wine);text-transform:uppercase;letter-spacing:.04em;display:block;text-align:center}
.dcol{min-width:60px;text-align:center}
.dcol .dnum{min-width:0;display:block}
.sun.closed{opacity:.75}
.sun.closed .dmeta,.sun.closed .dcol{opacity:.6}
.chip.dis{opacity:.5;border-style:dashed}
.sun.closed .sun-h{cursor:default}
.fixa{font-size:11px;font-weight:600;opacity:.85}
.refbox{border:1.5px dashed var(--line)}
.addref{margin-top:10px}
.cal{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:12px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-w{font-size:12px;font-weight:600;color:var(--mut);text-align:center;padding:4px 0}
.cal-d{all:unset;box-sizing:border-box;cursor:pointer;min-height:58px;border-radius:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);position:relative}
.cal-d:focus-visible{outline:3px solid var(--wine)}
.cal-d.x{background:transparent;cursor:default}
.cal-d.closed{opacity:.4}
.cal-d.special .cn{box-shadow:inset 0 0 0 2px var(--warn);border-radius:50%}
.cal-d.today .cn{background:var(--wine);color:#fff;border-radius:50%}
.cal-d.pend{box-shadow:inset 0 0 0 2px var(--warn)}
.cn{font-weight:600;font-size:15px;width:28px;height:28px;display:grid;place-items:center}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:40px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--wine)}
.dot.g{background:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tally{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px;margin-top:8px}
.tally b{font-weight:600;text-align:right}
.agrp{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.agrp b{font:700 17px/1 var(--cond);letter-spacing:.02em;color:var(--green)}
.agrp small{color:var(--mut);font-size:13px}
.fwchips{display:flex;flex-wrap:wrap;gap:6px}
.fwchips .chip{min-height:40px;padding:6px 10px}
</style>
</head>

}

      L.forEach(([t,s])=>{let fs=s?17:21;const b=s?'':'700 ';x.font=b+fs+'px '+F;while(x.measureText(t).width>CW-14&&fs>11){fs--;x.font=b+fs+'px '+F}
        x.fillStyle=s?'#23704a':'#17221b';x.fillText(t,X+7,ty);ty+=28});
    }
    y0+=rh[r]+G;
  }

}

  const D=mday(s.dataset.d),key=s.dataset.key;
  if(key.startsWith('r:')){const r=D.ref.find(x=>x.id===key.slice(2));if(r){r.e=s.value;r.s=s.value?'chamado':''}}
  else{const old=D.cob[key]||{};if(s.value)D.cob[key]={e:s.value,s:'chamado',rec:old.rec||[]};else delete D.cob[key]}
  commit();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&cov){cov=null;render();return}if(ev.key==='Escape'&&sheet){sheet='';render();return}if(ev.key==='Enter'&&ev.target.tagName==='INPUT'&&ev.target.closest('.addbox,.pform')){const b=ev.target.closest('.addbox,.pform').querySelector('.btn.pri');b&&b.click()}});
</script>
