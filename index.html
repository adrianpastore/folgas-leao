<style>
:root{
  --bg:#f2f4ef;--paper:#fff;--ink:#17221b;--mut:#5b695f;--line:#d6ddd4;
  --band:#1f4a33;--band-ink:#fff;--green:#1f4a33;--green-2:#e2ece4;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1612;--paper:#18221c;--ink:#edf2ec;--mut:#9aa89e;--line:#2b3a31;
  --band:#15301f;--green:#8fd0a8;--green-2:#1f3326;

:root[data-theme="dark"]{

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
.top{background:var(--band);color:var(--band-ink);border-bottom:4px solid #8e1f2f}
.top-in{max-width:680px;margin:0 auto;padding:14px 16px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:4px 12px}
.brand small{display:block;font-size:13px;opacity:.8;letter-spacing:.02em}
.brand h1{margin:0;font:700 26px/1 var(--cond);letter-spacing:.01em;white-space:nowrap}
.sync{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#9fd8b3;display:inline-block}
.sync.saving i{background:#f3c46b}.sync.err i,.sync.local i{background:#f2a0a9}

main{max-width:680px;margin:0 auto;padding:14px 14px 110px}

/* month nav */
.mnav{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.mnav h2{flex:1;margin:0;text-align:center;font:700 24px/1.1 var(--cond)}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:22px;line-height:1;display:grid;place-items:center}
.lead{margin:0 0 14px;text-align:center;color:var(--mut);font-size:15px}

.sun{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sun.past{opacity:.62}
.sun.open{opacity:1;border-color:var(--green)}

.dnum{font:700 44px/.9 var(--cond);color:var(--wine);min-width:60px;text-align:center}
.dmeta b{display:block;font-weight:600}
.dmeta small{color:var(--mut);font-size:14px;display:block}
.nexttag{display:inline-block;font-size:12px;font-weight:600;color:var(--band-ink);background:var(--green);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
:root[data-theme="dark"] .nexttag{color:#0f1612}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nexttag{color:#0f1612}}
.pill{font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-2);color:var(--ok)}
.pill.warn{background:var(--warn-2);color:var(--warn)}
.pill.none{background:var(--bg);color:var(--mut)}
.sun-b{padding:4px 14px 14px;border-top:1px dashed var(--line)}
.step{font:700 19px/1.2 var(--cond);margin:14px 0 2px;display:flex;gap:8px;align-items:baseline}
.step span{color:var(--wine)}
.hint{color:var(--mut);font-size:14px;margin:0 0 8px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;text-align:left;min-height:48px}
.chip small{display:block;color:var(--mut);font-size:12px;line-height:1.1}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.chip.on small{color:#fff;opacity:.85}
:root[data-theme="dark"] .chip.on,:root[data-theme="dark"] .chip.on small{color:#1a0d10}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on,:root:not([data-theme="light"]) .chip.on small{color:#1a0d10}}

.cov-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.cov-h b{font-size:17px}.cov-h .role{color:var(--mut);font-size:14px;margin-left:4px}
.st{font-size:13px;font-weight:600}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--wine)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px;background:var(--paper)}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;font-size:15px;min-height:44px}
.seg button+button{border-left:1px solid var(--line)}

label.fl{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
select,input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;min-height:46px}
.note{font-size:14px;margin:10px 0 0}
.note.ok{color:var(--ok)}.note.bad{color:var(--wine)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.wa{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--wine);border-color:transparent;background:transparent}
.work{color:var(--mut);font-size:14px;margin:14px 0 0}

.sec h2{margin:0;font:700 22px/1 var(--cond)}

.person .pm{color:var(--mut);font-size:14px;display:block}
.person .edit{color:var(--mut);font-size:14px}
.pform{padding:0 14px 14px}
.addbox{background:var(--paper);border:1.5px dashed var(--green);border-radius:14px;padding:14px;margin-bottom:6px}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--mut);text-align:center}

.c .n{font-size:11px;font-weight:700;display:block}.c.s .n{color:#8e1f2f;font-size:13px}
.nm{font-size:12px;font-weight:700;overflow-wrap:anywhere}.ex{font-size:10.5px;color:#23704a;margin-bottom:2px}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs-in{max-width:680px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--mut);min-height:60px;position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--wine);font-weight:600}
.tabs button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--wine);border-radius:0 0 3px 3px}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--warn);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:15px;z-index:6;max-width:calc(100% - 28px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
.toast[hidden]{display:none}
/* v2 */
.dname{font:700 15px/1 var(--cond);color:var(--wine);text-transform:uppercase;letter-spacing:.04em;display:block;text-align:center}
.dcol{min-width:60px;text-align:center}
.dcol .dnum{min-width:0;display:block}
.sun.closed{opacity:.75}
.sun.closed .dmeta,.sun.closed .dcol{opacity:.6}
.chip.dis{opacity:.5;border-style:dashed}
.sun.closed .sun-h{cursor:default}
.fixa{font-size:11px;font-weight:600;opacity:.85}
.refbox{border:1.5px dashed var(--line)}
.addref{margin-top:10px}
.cal{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:12px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-w{font-size:12px;font-weight:600;color:var(--mut);text-align:center;padding:4px 0}
.cal-d{all:unset;box-sizing:border-box;cursor:pointer;min-height:58px;border-radius:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);position:relative}
.cal-d:focus-visible{outline:3px solid var(--wine)}
.cal-d.x{background:transparent;cursor:default}
.cal-d.closed{opacity:.4}
.cal-d.special .cn{box-shadow:inset 0 0 0 2px var(--warn);border-radius:50%}
.cal-d.today .cn{background:var(--wine);color:#fff;border-radius:50%}
.cal-d.pend{box-shadow:inset 0 0 0 2px var(--warn)}
.cn{font-weight:600;font-size:15px;width:28px;height:28px;display:grid;place-items:center}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:40px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--wine)}
.dot.g{background:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tally{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px;margin-top:8px}
.tally b{font-weight:600;text-align:right}
.fwchips{display:flex;flex-wrap:wrap;gap:6px}
.fwchips .chip{min-height:40px;padding:6px 10px}
</style>
</head>

let ref=doc(fdb,'app','estado'),me=uid(),lastAt=0,wTimer=null,unsub=null,user=null;
function setSync(k){const el=$('sync');const t={ok:'Sincronizado',saving:'Salvando…',local:'Offline: salvo no aparelho',err:'Erro ao salvar'}[k];el.className='sync '+k;el.querySelector('span').textContent=t}
function saveLocal(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function persistUI(){try{sessionStorage.setItem('ui3',JSON.stringify({tab,wk,mo,open,sub:teamSub}))}catch(e){}}
function push(){
  if(!user)return;clearTimeout(wTimer);setSync(navigator.onLine?'saving':'local');
  wTimer=setTimeout(()=>{lastAt=Date.now();
    setDoc(ref,clone({v:2,fixos:S.fixos,extras:S.extras,dias:S.dias,cfg:S.cfg,_by:me,_at:lastAt})).then(()=>setSync('ok')).catch(e=>{setSync('err');toast(e.code==='permission-denied'?'Seu usuário não tem permissão para editar':'Não foi possível salvar')})},450);
}
function commit(){imgUrl='';imgBlob=null;saveLocal();push();render()}
function startSync(){
  unsub&&unsub();
  unsub=onSnapshot(ref,{includeMetadataChanges:true},snap=>{
    if(!snap.exists()){push();return}
    if(snap.metadata.hasPendingWrites){setSync(navigator.onLine?'saving':'local');return}
    const d=snap.data()||{};
    setSync(snap.metadata.fromCache&&!navigator.onLine?'local':'ok');
    if(d._by===me&&d._at===lastAt)return;
    const wasOld=!d.dias&&d.dom;
    S=norm(clone(d));saveLocal();imgUrl='';imgBlob=null;safeRender();
    if(wasOld)push();
  },e=>{setSync('err');if(e.code==='permission-denied')loginView('Este e-mail não tem acesso. Confira as regras do Firestore.')});
}
function safeRender(){const a=document.activeElement;if(a&&$('app').contains(a)&&a.tagName==='INPUT'){needsRender=true;return}render()}
document.addEventListener('focusout',()=>{if(needsRender){needsRender=false;setTimeout(render,0)}});

function loginView(err){
  $('tabs').innerHTML='';$('sync').style.visibility='hidden';
  $('app').innerHTML=`<div class="card" style="margin-top:20px"><h3>Entrar</h3><p class="hint">Use o e-mail e a senha cadastrados no Firebase.</p>
  <label class="fl" for="le">E-mail</label><input id="le" type="email" autocomplete="username">
  <label class="fl" for="lp">Senha</label><input id="lp" type="password" autocomplete="current-password">
  ${err?`<p class="note bad">${esc(err)}</p>`:''}
  <div class="row"><button class="btn pri" id="lb">Entrar</button></div></div>`;
  const go=()=>{$('lb').disabled=true;const em=$('le').value.trim().toLowerCase();signInWithEmailAndPassword(auth,em,$('lp').value).catch(e=>{
    const c=(e&&e.code)||'desconhecido';
    const M={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'Senha incorreta.','auth/user-not-found':'Não existe usuário com esse e-mail.','auth/invalid-email':'E-mail em formato inválido.',
      'auth/unauthorized-domain':'Este site não está nos domínios autorizados (Authentication > Settings > Authorized domains).',
      'auth/operation-not-allowed':'O login por E-mail/senha não está ativado (Authentication > Sign-in method).',
      'auth/configuration-not-found':'Ative E-mail/senha em Authentication > Sign-in method.',
      'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'A apiKey do firebaseConfig está errada.',
      'auth/network-request-failed':'Sem conexão com o Firebase.','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos.'};
    loginView((M[c]||'Não foi possível entrar.')+' (código: '+c+')');$('le').value=em;})};
  $('lb').onclick=go;$('lp').onkeydown=e=>{if(e.key==='Enter')go()};
}
onAuthStateChanged(auth,u=>{
  user=u;
  if(!u){unsub&&unsub();unsub=null;loginView();return}
  $('sync').style.visibility='';render();startSync();
});
window.addEventListener('online',()=>user&&setSync('saving'));
window.addEventListener('offline',()=>user&&setSync('local'));

/* ---------- semana ---------- */
function vWeek(){
  if(!S.fixos.length)return `<div class="empty"><p>Para começar, cadastre a equipe.</p><button class="btn pri" data-a="tab" data-id="team">Cadastrar equipe</button></div>`;

function extraSelect(k,key,cur,used,role,rec,label){
  const opts=[...S.extras].sort((a,b)=>same(b.r,role)-same(a.r,role)||a.n.localeCompare(b.n));

      return `<option value="${e.id}"${cur===e.id?' selected':''}${busy?' disabled':''}>${esc(e.n)}${e.r?' ('+esc(e.r)+')':''}${role&&same(e.r,role)?' ★ mesma função':''}${busy?' – já escalado':''}${r?' – recusou':''}</option>`}).join('')+'</select>';

function statusSeg(k,key,c,ex){

    [['chamado','Ainda não','warn'],['confirmado','Confirmou','ok'],['recusou','Recusou','bad']].map(([s,l,cl])=>`<button class="${c.s===s?'on '+cl:''}" data-a="st" data-v="${s}" data-key="${key}" data-d="${k}">${l}</button>`).join('')+'</div>';

function dayBody(k){

  const used=new Set([...Object.values(D.cob||{}).filter(c=>c.e&&c.s!=='recusou').map(c=>c.e),...ref.filter(r=>r.e&&r.s!=='recusou').map(r=>r.e)]);
  let h=`<div class="step"><span>1</span>Quem folga neste dia?</div><p class="hint">Toque no nome para marcar ou tirar a folga.</p><div class="chips">`+
    S.fixos.map(p=>{const on=off.includes(p);const fixa=isFixa(p,k);
      const other=isSun&&!on?sundayOffs(p,k.slice(0,7)):[];
      const sub=other.length?`já folga dia ${+other[0].slice(8)}`:fixa?(on?'folga fixa':'trocou a folga fixa'):(p.r||'');
      return `<button class="chip${on?' on':''}${other.length?' dis':''}" data-a="fol" data-id="${p.id}" data-d="${k}" aria-pressed="${on}"${other.length?' aria-disabled="true"':''}>${esc(p.n)}<small>${esc(sub)}</small></button>`}).join('')+'</div>'+
    (isSun?(()=>{const sem=S.fixos.filter(p=>!sundayOffs(p,k.slice(0,7)).length);return `<p class="hint" style="margin-top:8px">Domingo: cada um folga 1 por mês. ${sem.length?'Ainda sem domingo em '+monthName(k.slice(0,7)).split(' ')[0].toLowerCase()+': '+listNames(sem.map(p=>esc(p.n)))+'.':'Todos já têm o domingo do mês.'}</p>`})():'');
  if(off.length){
    h+=`<div class="step"><span>2</span>Quem cobre cada folga?</div>`;
    h+=off.map(p=>{
      const c=(D.cob||{})[p.id]||{},ex=c.e&&extraById(c.e),vend=!!c.v;
      let st;
      if(vend)st='<span class="st ok">Vendeu a folga</span>';
      else if(ex&&c.s==='confirmado')st=`<span class="st ok">Coberto por ${esc(ex.n)}</span>`;
      else if(ex&&c.s==='chamado')st=`<span class="st warn">Esperando ${esc(ex.n)}</span>`;
      else if(ex&&c.s==='recusou')st='<span class="st bad">Precisa de outro extra</span>';
      else st='<span class="st bad">Sem cobertura</span>';
      let x=`<div class="cov"><div class="cov-h"><div><b>${esc(p.n)}</b><span class="role">${esc(p.r||'')}</span></div>${st}</div>

      if(vend)return x+`<p class="note ok">${esc(p.n)} vem trabalhar normalmente.</p></div>`;
      if(!S.extras.length)return x+`<p class="note">Nenhum extra cadastrado ainda.</p><div class="row"><button class="btn" data-a="goadd" data-v="extra">Cadastrar extra</button></div></div>`;
      x+=extraSelect(k,p.id,c.e,used,p.r,c.rec,`Extra para o lugar de ${esc(p.n)}`);
      if(ex){x+=statusSeg(k,p.id,c,ex);if(c.s!=='recusou')x+=waBtn(ex,k,`, no lugar de ${p.n}${p.r?' ('+p.r+')':''}`,c.s)}
      return x+'</div>';
    }).join('');
  }
  h+=`<div class="step"><span>${off.length?3:2}</span>Extras de reforço</div><p class="hint">Para dias de movimento maior, mesmo sem ninguém de folga.</p>`;
  h+=ref.map(r=>{
    const ex=r.e&&extraById(r.e);
    const st=!ex?'<span class="st bad">Escolha o extra</span>':r.s==='confirmado'?'<span class="st ok">Confirmado</span>':r.s==='recusou'?'<span class="st bad">Recusou</span>':'<span class="st warn">Esperando resposta</span>';
    let x=`<div class="cov refbox"><div class="cov-h"><div><b>${ex?esc(ex.n):'Reforço'}</b>${ex&&ex.r?`<span class="role">${esc(ex.r)}</span>`:''}</div>${st}</div>`;
    x+=extraSelect(k,'r:'+r.id,r.e,used,'',r.rec,'Qual extra?');
    if(ex){x+=statusSeg(k,'r:'+r.id,r,ex);if(r.s!=='recusou')x+=waBtn(ex,k,', para reforçar a equipe',r.s)}
    return x+`<div class="row"><button class="btn danger" data-a="rmref" data-key="r:${r.id}" data-d="${k}">Tirar este reforço</button></div></div>`;
  }).join('');
  h+=S.extras.length?`<button class="btn addref" data-a="addref" data-d="${k}">+ Chamar extra de reforço</button>`:`<div class="row"><button class="btn" data-a="goadd" data-v="extra">Cadastrar extra</button></div>`;
  const w=S.fixos.filter(p=>!off.includes(p));
  if(w.length)h+=`<p class="work">Trabalham: ${listNames(w.map(p=>esc(p.n)))}.</p>`;
  h+=`<div class="row" style="margin-top:16px;border-top:1px dashed var(--line);padding-top:10px">${isExc(k)?`<button class="btn ghost" data-a="exc" data-d="${k}" data-v="reset">Desfazer abertura especial</button>`:`<button class="btn ghost" data-a="exc" data-d="${k}" data-v="close">Fechar neste dia (feriado)</button>`}</div>`;
  return h;

/* ---------- mês ---------- */
function monthDays(m){const [y,mm]=m.split('-').map(Number),r=[],x=new Date(y,mm-1,1);while(x.getMonth()===mm-1){r.push(iso(x));x.setDate(x.getDate()+1)}return r}
function vMonth(){
  const t=iso(today()),days=monthDays(mo),lead=(toD(days[0]).getDay()+6)%7;
  let h=`<div class="mnav"><button class="ib" data-a="mprev" aria-label="Mês anterior">‹</button><h2>${monthName(mo)}</h2><button class="ib" data-a="mnext" aria-label="Próximo mês">›</button></div>`;
  h+=`<div class="cal"><div class="cal-g">`+ORDER.map(i=>`<div class="cal-w">${WS[i]}</div>`).join('');
  for(let i=0;i<lead;i++)h+='<div class="cal-d x"></div>';
  days.forEach(k=>{
    if(!isOpen(k)){h+=`<button class="cal-d closed" data-a="goday" data-id="${k}" aria-label="${dm(k)}: fechado"><span class="cn">${+k.slice(8)}</span></button>`;return}
    const {off,pend,extras}=status(k);
    const dots=off.slice(0,4).map(()=>'<i class="dot"></i>').join('')+extras.slice(0,4).map(()=>'<i class="dot g"></i>').join('');
    const lbl=`${WD[toD(k).getDay()]}, ${dm(k)}: ${off.length} de folga, ${extras.length} extras${pend?', '+pend+' pendente':''}`;
    h+=`<button class="cal-d${k===t?' today':''}${isExc(k)?' special':''}${pend&&k>=t?' pend':''}" data-a="goday" data-id="${k}" aria-label="${lbl}"><span class="cn">${+k.slice(8)}</span><span class="dots">${dots}</span></button>`;
  });
  h+=`</div><div class="legend"><span><i class="dot"></i> folga</span><span><i class="dot g"></i> extra confirmado</span><span><i style="width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 2px var(--warn);display:inline-block"></i> falta resolver</span><span><i style="width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--warn);display:inline-block"></i> abertura especial</span></div></div>`;
  // tally
  const cnt={},ext={};days.forEach(k=>{if(!isOpen(k))return;const s=status(k);s.off.forEach(p=>cnt[p.id]=(cnt[p.id]||0)+1);s.extras.forEach(e=>ext[e.id]=(ext[e.id]||0)+1)});
  h+=`<div class="card"><h3>Resumo do mês</h3><p class="hint">Folgas de cada fixo (com o domingo do mês) e dias trabalhados pelos extras.</p><div class="tally">`+
    S.fixos.map(p=>{const sd=sundayOffs(p,mo);return `<span>${esc(p.n)}<small style="display:block;color:${sd.length?'var(--mut)':'var(--warn)'};font-size:13px">${sd.length?'Domingo: dia '+(+sd[0].slice(8)):'Ainda sem folga de domingo'}</small></span><b>${cnt[p.id]||0} ${(cnt[p.id]||0)===1?'folga':'folgas'}</b>`}).join('')+
    S.extras.filter(e=>ext[e.id]).map(e=>`<span>${esc(e.n)} <small style="color:var(--mut)">(extra)</small></span><b>${ext[e.id]} ${ext[e.id]===1?'dia':'dias'}</b>`).join('')+`</div></div>`;
  h+=`<div class="card"><h3>Calendário para o grupo</h3>${imgUrl?`<img class="gi" src="${imgUrl}" alt="Calendário de folgas de ${monthName(mo)}"><div class="row"><button class="btn pri" data-a="dl">Salvar imagem</button>${navigator.canShare?'<button class="btn" data-a="shimg">Compartilhar</button>':''}</div><p class="hint" style="margin-top:8px">No celular, dá para tocar e segurar a imagem para salvar.</p>`:`<p class="hint">Gera uma imagem do mês com os nomes de quem folga e dos extras.</p><div class="row"><button class="btn pri" data-a="gen">Criar imagem do mês</button></div>`}</div>`;
  const txt=monthText();
  h+=`<div class="card"><h3>Mensagem do mês</h3><pre class="pre">${esc(txt)}</pre><div class="row"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Enviar no WhatsApp</a><button class="btn" data-a="copy" data-v="month">Copiar texto</button></div></div>`;

}
function linesFor(k){const {D,off,ref}=status(k),L=[];
  off.forEach(p=>{L.push([p.n,0]);const c=(D.cob||{})[p.id];if(okCob(c)&&c.e)L.push(['extra: '+extraById(c.e).n,1]);if(c&&c.v)L.push(['vendeu a folga',1])});
  ref.filter(okRef).forEach(r=>L.push(['reforço: '+extraById(r.e).n,1]));return L}
function textFor(days){return days.filter(k=>isOpen(k)&&linesFor(k).length).map(k=>{const d=toD(k);return `*${WS[d.getDay()]} ${k.slice(8)}/${k.slice(5,7)}*\n`+linesFor(k).map(([t,s])=>s?'   '+t:'• '+t+' (folga)').join('\n')}).join('\n\n')}
function weekText(){const b=textFor([...Array(7)].map((_,i)=>addDays(wk,i)));return `*Escala da semana – ${weekLabel(wk)}*\nChurrascaria Leão do Parque\n\n`+(b||'Sem folgas nem extras nesta semana.')}
function monthText(){const b=textFor(monthDays(mo));return `*Folgas e extras – ${monthName(mo)}*\nChurrascaria Leão do Parque\n\n`+(b||'Sem folgas nem extras neste mês.')}
function drawImg(){
  const days=monthDays(mo),lead=(toD(days[0]).getDay()+6)%7,rows=Math.ceil((lead+days.length)/7);
  const W=1080,P=30,G=4,CW=(W-2*P-6*G)/7;
  const rh=[];for(let r=0;r<rows;r++){let h=110;for(let c=0;c<7;c++){const i=r*7+c-lead;if(i>=0&&i<days.length)h=Math.max(h,56+linesFor(days[i]).length*28)}rh.push(h)}
  const HB=160,H=HB+24+40+rh.reduce((a,b)=>a+b+G,0)+30,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d'),F='Barlow,system-ui,sans-serif',FC='"Barlow Condensed","Arial Narrow",sans-serif';
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textBaseline='top';
  x.fillStyle='#1f4a33';x.fillRect(0,0,W,HB);x.fillStyle='#8e1f2f';x.fillRect(0,HB,W,10);
  x.fillStyle='#fff';x.font='700 58px '+FC;x.fillText('Churrascaria Leão do Parque',P,34);
  x.globalAlpha=.85;x.font='30px '+F;x.fillText('Folgas e extras, '+monthName(mo),P,102);x.globalAlpha=1;
  let y0=HB+24;
  ORDER.forEach((wd,c)=>{x.fillStyle='#5b695f';x.font='600 22px '+F;x.fillText(WS[wd],P+c*(CW+G)+8,y0+6)});
  y0+=40;
  for(let r=0;r<rows;r++){
    for(let c=0;c<7;c++){
      const i=r*7+c-lead,X=P+c*(CW+G);
      if(i<0||i>=days.length){x.fillStyle='#fafbf8';x.fillRect(X,y0,CW,rh[r]);continue}
      const k=days[i],L=linesFor(k),op=isOpen(k);
      x.fillStyle=!op?'#f4f4f2':L.length?'#f7e3e6':'#f1f3ee';x.fillRect(X,y0,CW,rh[r]);
      x.fillStyle=L.length?'#8e1f2f':'#5b695f';x.font='700 30px '+FC;x.fillText(+k.slice(8),X+8,y0+8);
      if(!op){x.fillStyle='#9aa39c';x.font='18px '+F;x.fillText('fechado',X+8,y0+50);continue}
      let ty=y0+50;
      L.forEach(([t,s])=>{let fs=s?17:21;const b=s?'':'700 ';x.font=b+fs+'px '+F;while(x.measureText(t).width>CW-14&&fs>11){fs--;x.font=b+fs+'px '+F}
        x.fillStyle=s?'#23704a':'#17221b';x.fillText(t,X+7,ty);ty+=28});
    }
    y0+=rh[r]+G;
  }
  return cv;
}
async function gen(){try{await document.fonts.load('700 58px "Barlow Condensed"');await document.fonts.load('30px Barlow')}catch(e){}
  const cv=drawImg();cv.toBlob(b=>{imgBlob=b;imgUrl=cv.toDataURL('image/png');render()},'image/png')}
function saveImg(){if(!imgBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(imgBlob);a.download='folgas-'+mo+'.png';document.body.appendChild(a);a.click();a.remove()}
async function shareImg(){if(!imgBlob)return;const file=new File([imgBlob],'folgas-'+mo+'.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Folgas e extras'});return}}catch(e){return}
  toast('Toque e segure a imagem para compartilhar')}

/* ---------- equipe ---------- */
function fwChips(sel){return `<div class="fwchips">`+ORDER.filter(i=>i!==0).map(i=>`<button type="button" class="chip${sel.includes(i)?' on':''}" data-a="fw" data-v="${i}" aria-pressed="${sel.includes(i)}">${WS[i]}</button>`).join('')+'</div>'}
function vTeam(){
  const isX=teamSub==='extras';
  let h=`<datalist id="fl">${roles().map(r=>`<option>${esc(r)}</option>`).join('')}</datalist>`;
  h+=`<div class="seg" role="tablist" style="margin:0 0 14px"><button role="tab" aria-selected="${!isX}" class="${!isX?'on':''}" data-a="sub" data-v="equipe">Equipe (${S.fixos.length})</button><button role="tab" aria-selected="${isX}" class="${isX?'on':''}" data-a="sub" data-v="extras">Extras (${S.extras.length})</button></div>`;
  if(adding){
    h+=`<div class="addbox"><div class="step" style="margin-top:0">${isX?'Novo extra':'Novo funcionário'}</div>
      <label class="fl" for="nn">Nome</label><input id="nn" autocomplete="off">
      <label class="fl" for="nr">Função</label><input id="nr" list="fl" autocomplete="off">
      ${isX?'<label class="fl" for="nt">WhatsApp com DDD</label><input id="nt" type="tel" inputmode="tel" placeholder="53 98415-3816"><label class="fl" for="np">Chave Pix</label><input id="np" autocomplete="off" placeholder="CPF, telefone, e-mail ou chave aleatória">':`<label class="fl">Folga fixa toda semana (se tiver)</label>${fwChips([])}`}
      <div class="row"><button class="btn pri" data-a="add">Adicionar</button><button class="btn ghost" data-a="cancel">Cancelar</button></div></div>`;
  }else h+=`<div class="row" style="margin-top:0;margin-bottom:12px"><button class="btn pri" data-a="goadd" data-v="${isX?'extra':'fixo'}">${isX?'+ Adicionar extra':'+ Adicionar funcionário'}</button></div>`;
  const row=(p,kind)=>{
    const meta=kind==='fixo'?`${esc(p.r||'Sem função')}${(p.fw||[]).filter(i=>i).length?', folga fixa: '+ORDER.filter(i=>i&&p.fw.includes(i)).map(i=>WS[i].toLowerCase()).join(', '):''}`:`${esc(p.r||'Sem função')}${p.t?', '+esc(p.t):''}${p.pix?'<br>Pix: '+esc(p.pix):'<br><span style="color:var(--warn)">Sem chave Pix</span>'}`;
    let x=`<div class="person"><button data-a="edit" data-id="${p.id}" aria-expanded="${editing===p.id}"><span><b>${esc(p.n)}</b><span class="pm">${meta}</span></span><span class="edit">${editing===p.id?'Fechar':'Editar'}</span></button>`;
    if(kind==='extra'&&p.pix&&editing!==p.id)x+=`<div style="padding:0 14px 12px"><button class="btn" data-a="copypix" data-id="${p.id}">Copiar Pix</button></div>`;
    if(editing===p.id)x+=`<div class="pform"><label class="fl" for="en">Nome</label><input id="en" value="${esc(p.n)}"><label class="fl" for="er">Função</label><input id="er" list="fl" value="${esc(p.r||'')}">${kind==='extra'?`<label class="fl" for="et">WhatsApp com DDD</label><input id="et" type="tel" inputmode="tel" value="${esc(p.t||'')}"><label class="fl" for="ep">Chave Pix</label><input id="ep" autocomplete="off" value="${esc(p.pix||'')}" placeholder="CPF, telefone, e-mail ou chave aleatória">`:`<label class="fl">Folga fixa toda semana</label>${fwChips(p.fw||[])}<p class="hint" style="margin-top:6px">Aparece automaticamente em todas as semanas. Dá para trocar dia a dia. A folga de domingo é marcada no próprio dia (1 por mês).</p>`}
      <div class="row"><button class="btn pri" data-a="savep" data-id="${p.id}" data-v="${kind}">Salvar</button><button class="btn danger" data-a="rm" data-id="${p.id}" data-v="${kind}">Remover ${esc(p.n)}</button></div></div>`;
    return x+'</div>';
  };
  if(!isX){
    h+=S.fixos.length?S.fixos.map(p=>row(p,'fixo')).join(''):'<div class="empty">Ninguém cadastrado ainda.</div>';
    h+=`<div class="sec"><h2>Dias em que a casa abre</h2></div><div class="card"><p class="hint">Dias desmarcados aparecem como fechados.</p><div class="fwchips">`+ORDER.map(i=>{const on=S.cfg.open.includes(i);return `<button class="chip${on?' on':''}" data-a="openday" data-v="${i}" aria-pressed="${on}">${WS[i]}</button>`}).join('')+`</div></div>`;
  }else{
    h+=S.extras.length?S.extras.map(p=>row(p,'extra')).join(''):'<div class="empty">Cadastre os extras para poder chamá-los pelo WhatsApp e pagar pelo Pix.</div>';
  }
  h+=`<div class="row" style="margin-top:24px"><span class="hint" style="margin:0">Conectado como ${esc(user&&user.email||'')}</span><button class="btn ghost" data-a="logout">Sair</button></div>`;
  return h;
}

function render(){
  persistUI();renderTabs();
  $('app').innerHTML=tab==='week'?vWeek():tab==='month'?vMonth():vTeam();
}

/* ---------- events ---------- */
function covObj(D,key){if(key.startsWith('r:'))return D.ref.find(r=>r.id===key.slice(2));return D.cob[key]}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.a,id=b.dataset.id,k=b.dataset.d,v=b.dataset.v,key=b.dataset.key;
  if(a==='tab'){tab=id;editing=null;adding=false;render();window.scrollTo(0,0)}
  else if(a==='wprev'||a==='wnext'){wk=addDays(wk,a==='wnext'?7:-7);open='';render()}
  else if(a==='thisweek'){wk=monday(iso(today()));open=iso(today());render()}
  else if(a==='mprev'||a==='mnext'){const [y,mm]=mo.split('-').map(Number);mo=iso(new Date(y,mm-1+(a==='mnext'?1:-1),1)).slice(0,7);imgUrl='';imgBlob=null;render()}
  else if(a==='open'){open=open===id?'':id;render();if(open){const el=$('d-'+id);el&&el.scrollIntoView({block:'nearest',behavior:'smooth'})}}
  else if(a==='goday'){tab='week';wk=monday(id);open=id;render();setTimeout(()=>{const el=$('d-'+id);el&&el.scrollIntoView({block:'start',behavior:'smooth'})},30)}
  else if(a==='exc'){const snap=clone(S);if(v==='reset')delete S.cfg.exc[k];else S.cfg.exc[k]=v==='open';open=v==='open'||(v==='reset'&&isOpen(k))?k:open;commit();
    toast(v==='open'?'Aberto neste dia':v==='close'?'Fechado neste dia':'Voltou ao normal',snap)}
  else if(a==='fol'){const D=mday(k),p=S.fixos.find(x=>x.id===id);const isOff=offList(k).includes(p);
    if(!isOff&&toD(k).getDay()===0){const o=sundayOffs(p,k.slice(0,7));if(o.length){toast(`${p.n} já folga no domingo dia ${+o[0].slice(8)}. É só 1 domingo por mês.`);return}}
    if(isOff){if(D.off.includes(id))D.off=D.off.filter(x=>x!==id);if(isFixa(p,k)&&!D.on.includes(id))D.on.push(id);delete D.cob[id]}
    else{if(D.on.includes(id))D.on=D.on.filter(x=>x!==id);if(!isFixa(p,k))D.off.push(id)}
    commit()}
  else if(a==='mode'){const D=mday(k);if(v==='vend')D.cob[key]={v:1};else if(D.cob[key]&&D.cob[key].v)delete D.cob[key];commit()}
  else if(a==='st'){const D=mday(k),c=covObj(D,key);if(!c)return;c.s=v;if(v==='recusou')c.rec=[...new Set([...(c.rec||[]),c.e])];commit()}
  else if(a==='addref'){mday(k).ref.push({id:uid(),e:'',s:'',rec:[]});commit()}
  else if(a==='rmref'){const D=mday(k),snap=clone(S);D.ref=D.ref.filter(r=>r.id!==key.slice(2));commit();toast('Reforço removido',snap)}
  else if(a==='sub'){teamSub=v;adding=false;editing=null;render()}
  else if(a==='copypix'){const e=extraById(id);if(e&&e.pix)(navigator.clipboard?navigator.clipboard.writeText(e.pix):Promise.reject()).then(()=>toast('Pix de '+e.n+' copiado')).catch(()=>toast('Pix: '+e.pix))}
  else if(a==='goadd'){tab='team';adding=true;addKind=v||'fixo';teamSub=addKind==='extra'?'extras':'equipe';editing=null;render();window.scrollTo(0,0);setTimeout(()=>$('nn')&&$('nn').focus(),0)}
  else if(a==='kind'){const n=$('nn').value,r=$('nr').value;addKind=v;render();$('nn').value=n;$('nr').value=r}
  else if(a==='cancel'){adding=false;render()}
  else if(a==='fw'){const on=!b.classList.contains('on');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)}
  else if(a==='openday'){const i=+v;S.cfg.open=S.cfg.open.includes(i)?S.cfg.open.filter(x=>x!==i):[...S.cfg.open,i];commit()}
  else if(a==='add'){const n=$('nn').value.trim();if(!n){$('nn').focus();toast('Escreva o nome');return}
    const r=$('nr').value.trim(),box=b.closest('.addbox');
    if(addKind==='fixo')S.fixos.push({id:uid(),n,r,fw:[...box.querySelectorAll('[data-a=fw].on')].map(x=>+x.dataset.v)});
    else S.extras.push({id:uid(),n,r,t:$('nt')?$('nt').value.trim():'',pix:$('np')?$('np').value.trim():''});
    adding=false;commit();toast(n+' adicionado')}
  else if(a==='edit'){editing=editing===id?null:id;adding=false;render()}
  else if(a==='savep'){const L=v==='fixo'?S.fixos:S.extras,p=L.find(x=>x.id===id);if(!p)return;const n=$('en').value.trim();if(!n){$('en').focus();return}
    p.n=n;p.r=$('er').value.trim();if(v==='extra'){p.t=$('et').value.trim();p.pix=$('ep').value.trim()}else p.fw=[...b.closest('.pform').querySelectorAll('[data-a=fw].on')].map(x=>+x.dataset.v);
    editing=null;commit();toast('Alterações salvas')}
  else if(a==='rm'){const snap=clone(S),L=v==='fixo'?'fixos':'extras',p=S[L].find(x=>x.id===id);S[L]=S[L].filter(x=>x.id!==id);editing=null;commit();toast((p?p.n:'Pessoa')+' removido',snap)}
  else if(a==='logout')signOut(auth);
  else if(a==='gen')gen();
  else if(a==='dl')saveImg();
  else if(a==='shimg')shareImg();
  else if(a==='copy'){const t=v==='week'?weekText():monthText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Texto copiado')).catch(()=>toast('Selecione o texto e copie manualmente'))}
});
document.addEventListener('change',ev=>{
  const s=ev.target.closest('select[data-a="ext"]');if(!s)return;
  const D=mday(s.dataset.d),key=s.dataset.key;
  if(key.startsWith('r:')){const r=D.ref.find(x=>x.id===key.slice(2));if(r){r.e=s.value;r.s=s.value?'chamado':''}}
  else{const old=D.cob[key]||{};if(s.value)D.cob[key]={e:s.value,s:'chamado',rec:old.rec||[]};else delete D.cob[key]}
  commit();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.tagName==='INPUT'&&ev.target.closest('.addbox,.pform')){const b=ev.target.closest('.addbox,.pform').querySelector('.btn.pri');b&&b.click()}});
</script>
